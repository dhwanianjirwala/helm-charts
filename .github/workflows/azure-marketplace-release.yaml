name: Azure Marketplace Release

# Publishes the amazon-cloudwatch-observability chart to Azure Marketplace as a
# Kubernetes application (CNAB bundle).
#
#   0. Detect a new upstream agent release and decide whether to run at all
#   1. Build the Marketplace bundle with CPA and push it to ACR
#   2. Replace the plan's technical-configuration package (delete + add)
#   3. Verify the digest Partner Center reports matches what we built
#   4. Record the published version so the next poll does not republish it
#
# Final publication stays MANUAL in Partner Center once Azure-side validation
# passes. This workflow never calls go-live.
#
# TRIGGERING
# ----------
# The release signal is a new tag on aws/amazon-cloudwatch-agent, which is a
# repository we do not own. GitHub Actions cannot subscribe to another repo's
# events, so this polls the upstream Releases API on a schedule. If upstream
# (or an intermediary we control) ever sends us a webhook, the
# repository_dispatch trigger below picks it up with no changes here.
#
# Auth is GitHub OIDC -> Microsoft Entra ID (no long-lived secrets):
#   https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect

on:
  schedule:
    # Every 6 hours. GitHub may delay or drop scheduled runs on a busy repo,
    # so this is a "within hours" guarantee, not a punctual one.
    - cron: '0 */6 * * *'
  repository_dispatch:
    types: [amazon-cloudwatch-agent-release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Publish this exact version (x.y.z) and SKIP the upstream/duplicate checks'
        required: false
        type: string
      dry_run:
        description: 'Build and push to ACR only; do not touch Partner Center'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for OIDC federation to Entra ID

# Two releases must never race each other into the same plan.
concurrency:
  group: azure-marketplace-release
  cancel-in-progress: false

env:
  AZURE_DIR: azure
  # The chart is NOT committed under azure/. It lives in its normal place in the
  # repo and is copied into azure/ at build time, so there is one source of
  # truth for the chart and no risk of the two copies drifting apart.
  CHART_NAME: amazon-cloudwatch-observability
  CHART_SRC: charts/amazon-cloudwatch-observability
  CPA_IMAGE: mcr.microsoft.com/container-package-app:latest
  UPSTREAM_REPO: aws/amazon-cloudwatch-agent

jobs:
  # ---------------------------------------------------------------------------
  # 0. Decide whether there is anything to publish.
  #
  # An upstream agent release is the SIGNAL, but it is not sufficient on its
  # own: the chart pins a specific agent build in values.yaml, and until
  # someone bumps that pin the chart still ships the previous agent. Publishing
  # on the bare upstream tag would push a stale chart to the Marketplace under
  # a new version number. So the gate is:
  #
  #   upstream has a new release  AND  the chart already pins it  AND
  #   this chart version has not been published before
  #
  # A "not yet" result is a clean no-op, not a failure - nothing is broken,
  # the chart simply has not caught up yet.
  # ---------------------------------------------------------------------------
  detect-release:
    name: Check for a new upstream release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      version: ${{ steps.gate.outputs.version }}
      upstream_tag: ${{ steps.gate.outputs.upstream_tag }}
      agent_tag: ${{ steps.gate.outputs.agent_tag }}
      dry_run: ${{ steps.gate.outputs.dry_run }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Evaluate release gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.tag }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # A scheduled or dispatched run is a real release; only an explicit
          # workflow_dispatch can ask for a dry run.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            DRY_RUN="${INPUT_DRY_RUN:-true}"
          else
            DRY_RUN=false
          fi
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

          skip() {
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=$1"        >> "$GITHUB_OUTPUT"
            echo "::notice::no publish: $1"
            { echo "### No publish"; echo ""; echo "$1"; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # The Marketplace plan is versioned by the CHART, not by the agent.
          # The agent version is an implementation detail of the chart.
          CHART_VERSION=$(grep -E '^version:' "${CHART_SRC}/Chart.yaml" \
            | head -1 | awk '{print $2}' | tr -d '"')
          if [[ ! "$CHART_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Chart.yaml version '$CHART_VERSION' is not a Marketplace version (x.y.z)"
            exit 1
          fi

          # --- manual override: publish exactly what was asked, no gate ------
          if [[ -n "${MANUAL_TAG:-}" ]]; then
            VERSION="${MANUAL_TAG#v}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::input tag '$MANUAL_TAG' is not a Marketplace version (x.y.z)"
              exit 1
            fi
            echo "should_run=true"              >> "$GITHUB_OUTPUT"
            echo "version=$VERSION"             >> "$GITHUB_OUTPUT"
            echo "upstream_tag=(manual)"        >> "$GITHUB_OUTPUT"
            echo "agent_tag=(not checked)"      >> "$GITHUB_OUTPUT"
            echo "reason=manual run for $VERSION (gate bypassed)" >> "$GITHUB_OUTPUT"
            echo "::warning::manual run - upstream and duplicate checks were skipped"
            exit 0
          fi

          # --- 1. newest upstream release ------------------------------------
          # /releases/latest already excludes drafts and prereleases.
          if [[ -n "${DISPATCH_TAG:-}" ]]; then
            UPSTREAM_TAG="$DISPATCH_TAG"
            echo "Upstream tag supplied by repository_dispatch: $UPSTREAM_TAG"
          else
            UPSTREAM_TAG=$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq '.tag_name')
          fi
          if [[ -z "$UPSTREAM_TAG" ]]; then
            echo "::error::could not read the latest release of ${UPSTREAM_REPO}"
            exit 1
          fi
          UPSTREAM_VERSION="${UPSTREAM_TAG#v}"
          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"

          # --- 2. which agent build does the chart actually pin? -------------
          # PyYAML ships with the runner image; the fallbacks cover a future
          # image where it does not (PEP 668 makes a plain install fail).
          python3 -c 'import yaml' 2>/dev/null \
            || pip install --quiet pyyaml \
            || pip install --quiet --break-system-packages pyyaml
          AGENT_TAG=$(python3 - <<'PY'
          import os, yaml
          with open(os.path.join(os.environ["CHART_SRC"], "values.yaml")) as fh:
              print(yaml.safe_load(fh)["agent"]["image"]["tag"])
          PY
          )
          if [[ -z "$AGENT_TAG" ]]; then
            echo "::error::could not read agent.image.tag from ${CHART_SRC}/values.yaml"
            exit 1
          fi
          echo "agent_tag=$AGENT_TAG" >> "$GITHUB_OUTPUT"
          # Chart tags carry a build suffix: 1.300073.0b1828 -> 1.300073.0
          AGENT_VERSION="${AGENT_TAG%%b*}"

          echo "upstream release : $UPSTREAM_TAG  (version $UPSTREAM_VERSION)"
          echo "chart agent pin  : $AGENT_TAG     (version $AGENT_VERSION)"
          echo "chart version    : $CHART_VERSION"

          if [[ "$AGENT_VERSION" != "$UPSTREAM_VERSION" ]]; then
            skip "upstream is at ${UPSTREAM_TAG} but the chart still pins agent ${AGENT_TAG}. Bump agent.image.tag (and the chart version) first."
          fi

          # --- 3. has this chart version already been published? -------------
          MARKER="marketplace/${CHART_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${MARKER}" >/dev/null 2>&1; then
            skip "chart ${CHART_VERSION} was already published (marker tag ${MARKER} exists). Bump the chart version to publish again."
          fi

          echo "should_run=true"      >> "$GITHUB_OUTPUT"
          echo "version=$CHART_VERSION" >> "$GITHUB_OUTPUT"
          echo "reason=upstream ${UPSTREAM_TAG} is pinned by chart ${CHART_VERSION}" >> "$GITHUB_OUTPUT"
          {
            echo "### Release detected"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| upstream release | \`${UPSTREAM_TAG}\` |"
            echo "| chart agent pin | \`${AGENT_TAG}\` |"
            echo "| chart version (publishing as) | \`${CHART_VERSION}\` |"
            echo "| dry run | \`${DRY_RUN}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Fires immediately so the team knows a release started. Deliberately does NOT
  # fire on a poll that found nothing, or Slack would get 4 no-op pings a day.
  # ---------------------------------------------------------------------------
  notify-start:
    name: Notify - started
    needs: detect-release
    if: needs.detect-release.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Mapped at job level: the `secrets` context is not available in step `if`.
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL_MARKETPLACE }}
    steps:
      - name: Slack
        if: env.SLACK_WEBHOOK != ''
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_MARKETPLACE }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":rocket: Azure Marketplace release started",
              "version": "${{ needs.detect-release.outputs.version }}",
              "upstream_release": "${{ needs.detect-release.outputs.upstream_tag }}",
              "agent_image_tag": "${{ needs.detect-release.outputs.agent_tag }}",
              "trigger": "${{ github.event_name }}",
              "dry_run": "${{ needs.detect-release.outputs.dry_run }}",
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

  # ---------------------------------------------------------------------------
  # 1. Build the Marketplace bundle and push it to ACR.
  # ---------------------------------------------------------------------------
  build-bundle:
    name: Build bundle and push to ACR
    needs: detect-release
    if: needs.detect-release.outputs.should_run == 'true'
    # ubuntu-latest is linux/amd64 with Docker preinstalled, which CPA requires.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    env:
      VERSION: ${{ needs.detect-release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Verify expected repo layout
        run: |
          set -euo pipefail
          # Static Marketplace files, committed under azure/.
          for f in "${AZURE_DIR}/manifest.yaml" \
                   "${AZURE_DIR}/mainTemplate.json" \
                   "${AZURE_DIR}/createUIDefinition.json" \
                   "${AZURE_DIR}/README.md"; do
            [[ -f "$f" ]] || { echo "::error::missing required file: $f"; exit 1; }
          done
          # Chart source, copied in by the next step.
          [[ -f "${CHART_SRC}/Chart.yaml" ]] || {
            echo "::error::chart source not found at ${CHART_SRC}/Chart.yaml"; exit 1; }
          echo "Layout OK"

      - name: Stage chart into azure/
        run: |
          set -euo pipefail
          DEST="${AZURE_DIR}/${CHART_NAME}"
          # Remove any stale copy so a renamed or deleted chart file cannot
          # survive into the bundle.
          rm -rf "$DEST"
          cp -R "${CHART_SRC}" "$DEST"

          # Assert the copy actually landed - cp can partially succeed.
          [[ -f "${DEST}/Chart.yaml" ]]  || { echo "::error::staging failed: ${DEST}/Chart.yaml"; exit 1; }
          [[ -f "${DEST}/values.yaml" ]] || { echo "::error::staging failed: ${DEST}/values.yaml"; exit 1; }
          [[ -d "${DEST}/templates" ]]   || { echo "::error::staging failed: ${DEST}/templates"; exit 1; }

          CHART_VERSION=$(grep -E '^version:' "${DEST}/Chart.yaml" | head -1 | awk '{print $2}' | tr -d '"')
          echo "Staged ${CHART_SRC} -> ${DEST} (chart version ${CHART_VERSION})"

          # On a gated run these are equal by construction; on a manual run with
          # an explicit tag they may not be, and that is worth seeing.
          if [[ "$CHART_VERSION" != "$VERSION" ]]; then
            echo "::warning::chart version ${CHART_VERSION} != publish version ${VERSION}"
          fi
          {
            echo "### Chart staged"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| source | \`${CHART_SRC}\` |"
            echo "| destination | \`${DEST}\` |"
            echo "| chart version | \`${CHART_VERSION}\` |"
            echo "| publish version | \`${VERSION}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: |
          set -euo pipefail
          az acr login -n "${{ vars.ACR_NAME }}"

      - name: Build Marketplace bundle (CPA)
        run: |
          set -euo pipefail
          # NOTE: no -it here. The documented command uses -it, which fails in CI
          # because the runner has no TTY.
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}:/data" \
            -v "${HOME}/.docker:/root/.docker" \
            -w "/data/${AZURE_DIR}" \
            --entrypoint /bin/bash \
            "${CPA_IMAGE}" \
            -c "cpa buildbundle"

      - name: Resolve bundle digest from ACR
        id: digest
        run: |
          set -euo pipefail
          REPO="${{ vars.ACR_REPOSITORY }}"
          DIGEST=$(az acr manifest show-metadata \
            --registry "${{ vars.ACR_NAME }}" \
            --name "${REPO}:${VERSION}" \
            --query digest -o tsv)
          # Assert on the value, not just the exit code.
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::bundle not found in ACR or digest malformed: '${DIGEST}'"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "### Bundle pushed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| registry | \`${{ vars.ACR_NAME }}\` |"
            echo "| repository | \`${REPO}\` |"
            echo "| tag | \`${VERSION}\` |"
            echo "| digest | \`${DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 2. Replace the plan's technical-configuration package.
  # ---------------------------------------------------------------------------
  update-package:
    name: Replace Marketplace package
    needs: [detect-release, build-bundle]
    if: >-
      needs.detect-release.outputs.should_run == 'true' &&
      needs.detect-release.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: azure-marketplace # gate reviewers/secrets here if desired
    env:
      VERSION: ${{ needs.detect-release.outputs.version }}
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install partnercenter CLI extension
        run: |
          set -euo pipefail
          # Preview extension - pin a version here if you need reproducibility
          # across runs.
          az extension add --name partnercenter --only-show-errors
          az extension show --name partnercenter --query version -o tsv

      - name: Delete existing package
        run: |
          set -euo pipefail
          # A plan with no package yet is not an error; anything else is.
          if ! OUT=$(az partnercenter marketplace offer plan technical-configuration package delete \
                --offer-id "${{ vars.MARKETPLACE_OFFER_ID }}" \
                --plan-id "${{ vars.MARKETPLACE_PLAN_ID }}" \
                --repository "${{ vars.ACR_REPOSITORY }}" \
                --tag "${VERSION}" 2>&1); then
            if grep -qiE "not found|does not exist|no package" <<<"$OUT"; then
              echo "No existing package to delete - continuing."
            else
              echo "::error::package delete failed"
              echo "$OUT"
              exit 1
            fi
          fi

      - name: Add new package
        run: |
          set -euo pipefail
          az partnercenter marketplace offer plan technical-configuration package add \
            --offer-id "${{ vars.MARKETPLACE_OFFER_ID }}" \
            --plan-id "${{ vars.MARKETPLACE_PLAN_ID }}" \
            --registry "${{ vars.ACR_NAME }}" \
            --repository "${{ vars.ACR_REPOSITORY }}" \
            --tag "${VERSION}" \
            --digest "${{ needs.build-bundle.outputs.digest }}" \
            --resource-group "${{ vars.ACR_RESOURCE_GROUP }}" \
            --subscription-id "${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            --tenant-id "${{ vars.AZURE_TENANT_ID }}" \
            --cluster-extension-type "${{ vars.CLUSTER_EXTENSION_TYPE }}"

  # ---------------------------------------------------------------------------
  # 3. Verify the digest Partner Center reports matches what we built.
  # ---------------------------------------------------------------------------
  verify-sha:
    name: Verify package SHA
    needs: [detect-release, build-bundle, update-package]
    if: >-
      needs.detect-release.outputs.should_run == 'true' &&
      needs.detect-release.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install partnercenter CLI extension
        run: |
          set -euo pipefail
          az extension add --name partnercenter --only-show-errors

      - name: Compare digests
        run: |
          set -euo pipefail
          EXPECTED="${{ needs.build-bundle.outputs.digest }}"
          CONFIG=$(az partnercenter marketplace offer plan technical-configuration show \
            --offer-id "${{ vars.MARKETPLACE_OFFER_ID }}" \
            --plan-id "${{ vars.MARKETPLACE_PLAN_ID }}" -o json)
          echo "$CONFIG" > tech-config.json

          # The digest may sit under different keys across extension versions,
          # so search the document rather than assuming one path.
          REPORTED=$(python3 -c "
          import json,re,sys
          d=json.load(open('tech-config.json'))
          found=set()
          def walk(o):
              if isinstance(o,dict):
                  for k,v in o.items(): walk(v)
              elif isinstance(o,list):
                  for v in o: walk(v)
              elif isinstance(o,str) and re.fullmatch(r'sha256:[0-9a-f]{64}',o):
                  found.add(o)
          walk(d)
          print('\n'.join(sorted(found)))
          ")

          echo "expected: $EXPECTED"
          echo "reported: ${REPORTED:-<none>}"

          if [[ -z "$REPORTED" ]]; then
            echo "::error::no sha256 digest found in Partner Center technical configuration"
            exit 1
          fi
          if ! grep -Fxq "$EXPECTED" <<<"$REPORTED"; then
            echo "::error::digest mismatch - Partner Center does not report the bundle we built"
            exit 1
          fi
          echo "SHA verified."
          {
            echo "### SHA verified"
            echo ""
            echo "\`${EXPECTED}\`"
            echo ""
            echo "Azure-side validation runs next. **Publish manually in Partner Center** once it passes."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 4. Record what was published.
  #
  # This marker tag is what stops the next poll from republishing the same
  # chart. It is written ONLY after every preceding stage succeeded, so a run
  # that dies halfway leaves no marker and the next poll retries it.
  # ---------------------------------------------------------------------------
  record-release:
    name: Record published version
    needs: [detect-release, build-bundle, update-package, verify-sha]
    if: >-
      needs.detect-release.outputs.should_run == 'true' &&
      needs.detect-release.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the marker tag
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Tag the published version
        env:
          VERSION: ${{ needs.detect-release.outputs.version }}
          UPSTREAM_TAG: ${{ needs.detect-release.outputs.upstream_tag }}
          DIGEST: ${{ needs.build-bundle.outputs.digest }}
        run: |
          set -euo pipefail
          MARKER="marketplace/${VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$MARKER" -m "Azure Marketplace package for chart ${VERSION}

          upstream release: ${UPSTREAM_TAG}
          bundle digest:    ${DIGEST}
          run:              ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin "$MARKER"
          echo "Recorded $MARKER"

  # ---------------------------------------------------------------------------
  # Always reports, including on failure, cancellation and timeout. Stays silent
  # on a poll that found nothing to do.
  # ---------------------------------------------------------------------------
  notify-result:
    name: Notify - result
    needs: [detect-release, build-bundle, update-package, verify-sha, record-release]
    if: >-
      always() &&
      (needs.detect-release.outputs.should_run == 'true' ||
       needs.detect-release.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL_MARKETPLACE }}
    steps:
      - name: Compute outcome
        id: outcome
        run: |
          set -euo pipefail
          # Treat cancelled as failure: an unattended pipeline must never read
          # "cancelled" as "fine".
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || \
                "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "text=:x: Azure Marketplace release FAILED - pipeline stopped" >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.detect-release.outputs.dry_run }}" == "true" ]]; then
            echo "state=success" >> "$GITHUB_OUTPUT"
            echo "text=:test_tube: Azure Marketplace DRY RUN complete - bundle in ACR, Partner Center untouched" >> "$GITHUB_OUTPUT"
          else
            echo "state=success" >> "$GITHUB_OUTPUT"
            echo "text=:white_check_mark: Azure Marketplace package staged - publish manually in Partner Center" >> "$GITHUB_OUTPUT"
          fi

      - name: Slack
        if: env.SLACK_WEBHOOK != ''
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_MARKETPLACE }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ steps.outcome.outputs.text }}",
              "version": "${{ needs.detect-release.outputs.version }}",
              "upstream_release": "${{ needs.detect-release.outputs.upstream_tag }}",
              "detect": "${{ needs.detect-release.result }}",
              "build": "${{ needs.build-bundle.result }}",
              "update": "${{ needs.update-package.result }}",
              "verify": "${{ needs.verify-sha.result }}",
              "record": "${{ needs.record-release.result }}",
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

      - name: Fail the run if any stage failed
        if: ${{ steps.outcome.outputs.state == 'failure' }}
        run: |
          echo "::error::one or more stages failed - see job results above"
          exit 1
